name: Cinema Studio
version: 0.1.1
slug: cinema_studio
description: Import, edit, render and organize cinema clips for Home Assistant
url: https://github.com/NaturalDevCR/hass-cinema-studio
arch:
  - aarch64
  - amd64
startup: application
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:movie-open-play
panel_title: Cinema Studio
homeassistant_api: true
hassio_api: true
discovery:
  - cinema_studio
map:
  - media:rw
options:
  log_level: info
  encoder_threads: 4
schema:
  log_level: list(debug|info|warning|error)
  encoder_threads: int(0,64)
